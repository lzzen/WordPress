name: Local WordPress tests

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:

concurrency:
  group: local-wordpress-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, wordpress-test]
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm.cmd ci

      - name: Install Chromium
        run: npx.cmd playwright install chromium

      - name: Check PHP syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.php | ForEach-Object {
            php -l $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Run browser smoke tests
        run: npm.cmd test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Publish successful result
        if: success() && startsWith(github.ref_name, 'agent/issue-')
        shell: pwsh
        run: |
          $issue = '${{ github.ref_name }}' -replace '^agent/issue-', ''
          if ($issue -notmatch '^\d+$') { throw 'Invalid agent branch name' }
          $title = gh issue view $issue --repo '${{ github.repository }}' --json title --jq '.title'
          $pr = gh pr list --repo '${{ github.repository }}' --head '${{ github.ref_name }}' --json url --jq '.[0].url'
          if (-not $pr) {
            $pr = gh pr create --repo '${{ github.repository }}' --base master --head '${{ github.ref_name }}' `
              --title "Issue #${issue}: $title" `
              --body "Closes #${issue}`n`n本地 PHP 与 Playwright 测试已通过。`n`n测试站：${{ vars.TEST_BASE_URL }}`nWorkflow：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          gh issue edit $issue --repo '${{ github.repository }}' --remove-label 'workflow:agent' --add-label 'status:review'
          gh issue comment $issue --repo '${{ github.repository }}' --body "✅ 开发完成，本地测试通过。`n`n- 测试站：${{ vars.TEST_BASE_URL }}`n- Pull Request：$pr`n- 测试记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish failed result
        if: failure() && startsWith(github.ref_name, 'agent/issue-')
        shell: pwsh
        run: |
          $issue = '${{ github.ref_name }}' -replace '^agent/issue-', ''
          if ($issue -notmatch '^\d+$') { exit 0 }
          gh issue edit $issue --repo '${{ github.repository }}' --add-label 'status:test-failed'
          gh issue comment $issue --repo '${{ github.repository }}' --body "❌ 本地测试失败。`n`n查看日志与测试附件：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"



